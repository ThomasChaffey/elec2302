# PDF settings for the Week 13 notes, kept out of notes.qmd on purpose.
#
# If the qmd declares a pdf format, `quarto preview` builds the PDF on every
# save as well as the HTML, so any PDF-only problem breaks the web page too.
# Keeping these settings here means HTML is the only thing the site build
# touches, and the PDF is opt-in:
#
#   quarto render weeks/week13/notes.qmd --to pdf --metadata-file weeks/week13/_pdf.yml
#
# The leading underscore keeps Quarto from treating this file as site content.
#
# These options deliberately stick to what a minimal LaTeX install already has,
# so the build does not need to fetch packages.
documentclass: article
papersize: a4
geometry: margin=2.5cm
colorlinks: true
