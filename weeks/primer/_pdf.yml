# PDF settings for the primer, kept out of notes.qmd on purpose.
#
# If the qmd declares a pdf format, `quarto preview` builds the PDF on every
# save as well as the HTML, so any PDF-only problem (an SVG that needs
# rsvg-convert, say) breaks the web page too. Keeping these settings here means
# HTML is the only thing the site build touches, and the PDF is opt-in:
#
#   quarto render weeks/primer/notes.qmd --to pdf --metadata-file weeks/primer/_pdf.yml
#
# The leading underscore keeps Quarto from treating this file as site content.
#
# The circuit figures are SVG, so the PDF build needs rsvg-convert on the path
# (`brew install librsvg`); without it Quarto cannot turn them into something
# LaTeX will accept.
#
# These options deliberately stick to what a minimal LaTeX install already has,
# so the build does not need to fetch packages. A system-wide BasicTeX lives
# under /usr/local/texlive and is owned by root, so Quarto's automatic package
# installation fails there with a tlmgr permission error.
#
# With a user-writable TeX (`quarto install tinytex`), Quarto fetches whatever
# is missing by itself and you can switch to the nicer KOMA class:
#
#   documentclass: scrartcl
#   fig-pos: "H"          # needs the float package; keeps figures where written
#
documentclass: article
papersize: a4
geometry: margin=2.5cm
colorlinks: true
