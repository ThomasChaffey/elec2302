  attribute count.js looks for. And the site address printed inside each PDF
  carries ?ref=notes-pdf-week3, so a reader who types it in or follows it back
  shows up under that referrer. The first counts opening the file, the second
  counts returning to the site from it; neither counts reading it. The primer
