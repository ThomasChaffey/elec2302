project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "weeks/**/*.qmd"
  resources:
    - "weeks/*.pdf"
    - "weeks/**/*.pdf"     # per-week notes PDFs, built by tools/build-pdf.sh

website:
  title: ""
  description: "ELEC2302/9302 Signals and Systems: lecture notes"
  page-navigation: true
  search: false
  sidebar:
    style: floating
    search: false
    collapse-level: 2
    contents:
      - text: "Home"
        href: index.qmd
      - section: "Week 1 — Introduction"
        contents:
          - text: "Slides"
            href: weeks/week01/slides.qmd
            target: _blank
          - text: "Notes"
            href: weeks/week01/notes.qmd
      - section: "Week 2 — Signals as vectors, systems as maps"
        contents:
          - text: "Notes"
            href: weeks/week02/notes.qmd
          - text: "Tutorial"
            href: weeks/week02/tutorial1.pdf
            target: _blank
          - text: "Tutorial solutions"
            href: weeks/week02/tutorial1-solutions.pdf
            target: _blank
      - section: "Week 3 — Linear, time-invariant systems"
        contents:
          - text: "Notes"
            href: weeks/week03/notes.qmd
          - text: "Tutorial"
            href: weeks/week03/tutorial2.pdf
            target: _blank
      - section: "Week 4 — Periodic signals and the Fourier series"
        contents:
          - text: "Tutorial"
            href: weeks/week04/tutorial4.pdf
            target: _blank
      - text: "Quiz 1 formula sheet"
        href: weeks/formula-sheet.pdf
        target: _blank
      - text: "Primer on RLC circuits"
        href: weeks/primer/notes.qmd
  page-footer:
    center: "Thomas Chaffey · School of Electrical and Computer Engineering, University of Sydney"
    right: "[Analytics](analytics.qmd)"

format:
  html:
    theme: [cosmo, theme.scss]
    toc: false
    html-math-method: katex
    fig-cap-location: bottom
    link-external-newwindow: true
    include-in-header:
      - _goatcounter.html

engine: markdown
