project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "weeks/**/*.qmd"
  resources:
    - "weeks/*.pdf"

website:
  title: ""
  description: "ELEC2302/9302 Signals and Systems: lecture notes"
  page-navigation: true
  search: false
  sidebar:
    style: floating
    search: false
    collapse-level: 2
    contents:
      - text: "Home"
        href: index.qmd
      - section: "Week 1 — Introduction"
        contents:
          - text: "Slides"
            href: weeks/week01/slides.qmd
            target: _blank
          - text: "Notes"
            href: weeks/week01/notes.qmd
      - text: "Quiz 1 formula sheet"
        href: weeks/formula-sheet.pdf
        target: _blank
  page-footer:
    center: "Thomas Chaffey · School of Electrical and Computer Engineering, University of Sydney"

format:
  html:
    theme: [cosmo, theme.scss]
    toc: false
    html-math-method: katex
    fig-cap-location: bottom
    link-external-newwindow: true

engine: markdown
